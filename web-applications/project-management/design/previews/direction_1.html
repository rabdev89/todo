<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pristine Productivity Engine - Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #1a1d23;
            --text-muted: #6c757d;
            --primary: #2d3436;
            --accent: #00b894;
            --border: #e9ecef;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            padding: 24px;
        }

        header {
            margin-bottom: 24px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.02em;
        }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 4px;
            margin-right: 12px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .checkbox:hover {
            border-color: var(--accent);
        }

        .task-content {
            flex: 1;
        }

        .task-title {
            font-size: 15px;
            font-weight: 400;
        }

        .task-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .priority-high {
            color: #d63031;
            font-weight: 600;
        }

        .quick-add {
            margin-top: 24px;
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>My Tasks</h1>
        </header>
        <ul class="task-list">
            <li class="task-item">
                <div class="checkbox"></div>
                <div class="task-content">
                    <div class="task-title">Review Project vision</div>
                    <div class="task-meta">Today • <span class="priority-high">High</span></div>
                </div>
            </li>
            <li class="task-item">
                <div class="checkbox"></div>
                <div class="task-content">
                    <div class="task-title">Fix mobile navigation bug</div>
                    <div class="task-meta">Tomorrow • Medium</div>
                </div>
            </li>
            <li class="task-item">
                <div class="checkbox" style="background: var(--accent); border-color: var(--accent);"></div>
                <div class="task-content" style="text-decoration: line-through; opacity: 0.5;">
                    <div class="task-title">Setup database schema</div>
                    <div class="task-meta">Completed</div>
                </div>
            </li>
        </ul>
        <div class="quick-add">
            <input type="text" placeholder="Add a new task...">
            <button>+</button>
        </div>
    </div>
</body>
</html>
