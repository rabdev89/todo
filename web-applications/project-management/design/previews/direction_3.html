<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo-Tactile Workspace - Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffae00;
            --surface: #ffffff;
            --text: #000000;
            --accent: #ff00ff;
            --border: #000000;
        }

        body {
            background-color: var(--bg);
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .workspace {
            width: 380px;
            background: var(--surface);
            border: 4px solid var(--border);
            box-shadow: 12px 12px 0px var(--border);
            padding: 30px;
            transform: rotate(-1deg);
        }

        h1 {
            font-size: 40px;
            font-weight: 700;
            text-transform: uppercase;
            margin: 0 0 20px 0;
            border-bottom: 4px solid var(--border);
            padding-bottom: 10px;
        }

        .item {
            background: #fff;
            border: 3px solid var(--border);
            margin-bottom: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            font-size: 18px;
            font-weight: 500;
            transition: transform 0.1s;
            cursor: crosshair;
        }

        .item:hover {
            transform: translate(-4px, -4px);
            box-shadow: 4px 4px 0px var(--border);
            background: var(--bg);
        }

        .tag {
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            font-size: 12px;
            border: 2px solid var(--border);
            margin-left: auto;
            text-transform: uppercase;
        }

        .btn-add {
            width: 100%;
            background: var(--text);
            color: white;
            padding: 15px;
            border: none;
            font-family: inherit;
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-add:active {
            transform: translate(2px, 2px);
        }
    </style>
</head>
<body>
    <div class="workspace">
        <h1>TODO LIST</h1>
        <div class="item">
            Draft contract
            <span class="tag">Urgent</span>
        </div>
        <div class="item">
            Upload assets
            <span class="tag" style="background: #00ffff; color: black;">WIP</span>
        </div>
        <div class="item">
            Team sync
            <span class="tag" style="background: #00ff00; color: black;">Later</span>
        </div>
        <button class="btn-add">Add new task</button>
    </div>
</body>
</html>
