name: Agents prompt validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-prompts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run prompt validator
        run: node .agent/tests/validate_prompts.js
